name: Update Component Index

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Clone KiCad Libraries
        run: |
          git clone --depth 1 https://github.com/KiCad/kicad-symbols.git /tmp/kicad-libraries
          
      - name: Run KiCad Parser
        run: |
          python scripts/parse_kicad.py --input-dir /tmp/kicad-libraries --output-db index.db
          
      - name: Commit updated index
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add index.db
          git commit -m "Update index: $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PUSH_TOKEN }}
          branch: main