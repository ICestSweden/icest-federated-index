name: Update Component Index

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
          
      - name: Clone KiCad Libraries
        run: git clone --depth 1 https://github.com/KiCad/kicad-symbols.git /tmp/kicad-libraries
          
      - name: Run KiCad Parser
        run: python scripts/parse_kicad.py --input-dir /tmp/kicad-libraries --output-db index.db
          
      - name: Run Wikidata Parser
        run: python scripts/parse_wikidata.py
      
      - name: Run GitHub BOM Parser
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/parse_github_boms.py $GITHUB_API_TOKEN index.db
      
      - name: Run Digi-Key Parser
        env:
          DIGIKEY_CLIENT_ID: ${{ secrets.DIGIKEY_CLIENT_ID }}
          DIGIKEY_CLIENT_SECRET: ${{ secrets.DIGIKEY_CLIENT_SECRET }}
        run: python3 scripts/parse_digikey.py $DIGIKEY_CLIENT_ID $DIGIKEY_CLIENT_SECRET index.db
      
      - name: Run Kitspace Parser
        run: python3 scripts/parse_kitspace.py index.db
      
      - name: Auto-commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update component index"
          file_pattern: 'index.db'
          commit_user_name: GitHub Actions
          commit_user_email: actions@github.com